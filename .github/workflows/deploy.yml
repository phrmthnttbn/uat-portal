name: Deploy main and develop

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: production
        run: npm ci

      - name: Build production
        working-directory: production
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Install development dependencies
        working-directory: development
        run: npm ci

      - name: Build development
        working-directory: development
        run: npm run build -- --base="/${{ github.event.repository.name }}/develop/"

      - name: Combine both websites
        run: |
          mkdir -p site
          cp -a production/dist/. site/
          mkdir -p site/develop
          cp -a development/dist/. site/develop/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload websites
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy websites
        id: deployment
        uses: actions/deploy-pages@v4
