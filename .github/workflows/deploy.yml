name: Deploy main and develop
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: production
      - name: Build production
        run: npm run build -- --base="/${{ github.event.repository.name }}/"
        working-directory: production
      - run: npm ci
        working-directory: development
      - name: Test development
        run: npm test --if-present
        working-directory: development
      - name: Build development
        run: npm run build -- --base="/${{ github.event.repository.name }}/develop/"
        working-directory: development
      - name: Combine both websites
        run: |
          mkdir -p site
          cp -a production/dist/. site/
          mkdir -p site/develop
          cp -a development/dist/. site/develop/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
